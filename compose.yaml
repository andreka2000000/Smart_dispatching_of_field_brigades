name: magistral
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: magistral
      POSTGRES_USER: magistral
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magistral_local}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U magistral -d magistral
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: >-
        postgres://magistral:${POSTGRES_PASSWORD:-magistral_local}@postgres:5432/${API_DATABASE:-magistral}?sslmode=disable
      HTTP_ADDR: ':8080'
      EVALUATION_ADDR: ':8081'
      APP_ORIGINS: >-
        ${APP_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      OPTIMIZER_URL: ${OPTIMIZER_URL-http://optimizer:8090}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - /dev/null
        - http://127.0.0.1:8080/api/v1/health
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  optimizer:
    image: maxtelecom-optimizer
    build:
      context: .
      dockerfile: optimizer/Dockerfile
    mem_limit: 1g
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - '-c'
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  osrm-prepare:
    profiles:
      - routing
    image: >-
      ghcr.io/project-osrm/osrm-backend@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    volumes:
      - ./work/routing:/data
    entrypoint:
      - /bin/sh
      - '-ec'
    command:
      - |
        if [ ! -f /data/prepared ]; then
          osrm-extract --threads 2 -p /opt/car.lua /data/ekaterinburg.osm
          osrm-partition --threads 2 /data/ekaterinburg.osrm
          osrm-customize --threads 2 /data/ekaterinburg.osrm
          touch /data/prepared
        fi
    restart: 'no'
  osrm:
    profiles:
      - routing
    image: >-
      ghcr.io/project-osrm/osrm-backend@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    volumes:
      - ./work/routing:/data:ro
    command:
      - osrm-routed
      - '--algorithm'
      - mld
      - '--threads'
      - '2'
      - '--max-table-size'
      - '500'
      - /data/ekaterinburg.osrm
    ports:
      - 127.0.0.1:${OSRM_PORT:-5000}:5000
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    restart: unless-stopped
  tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgres://magistral:${POSTGRES_PASSWORD:-magistral_local}@postgres:5432/magistral?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  benchmark:
    profiles:
      - tools
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint:
      - /app/benchmark
    environment:
      OPTIMIZER_URL: http://optimizer:8090
    volumes:
      - ./work:/app/work
    command:
      - '-output'
      - /app/work/pyvrp-benchmark.json
    depends_on:
      optimizer:
        condition: service_healthy
  seed:
    profiles:
      - demo
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint:
      - /app/seed
    environment:
      API_URL: http://api:8081
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data: null
